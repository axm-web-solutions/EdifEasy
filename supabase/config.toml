# Configuracion para Supabase CLI (opcional).
# Si prefieres el flujo manual, ejecuta supabase/schema.sql desde el SQL Editor.
project_id = "edifeasy"

[api]
enabled = true
port = 54321
# `tribuia` es el esquema de la aplicacion: debe estar expuesto en la API REST.
schemas = ["tribuia", "public", "storage", "graphql_public"]
extra_search_path = ["tribuia", "public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:5173/reset-password"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true

[storage]
enabled = true
file_size_limit = "25MiB"

[realtime]
enabled = true

[functions.wompi-payments]
verify_jwt = true

# Alta de conjuntos desde el RUT: solo SUPER_ADMIN (se verifica dentro).
[functions.provision-condominium]
verify_jwt = true

# Wompi no envia JWT de Supabase; la autenticidad se valida con el checksum.
[functions.wompi-webhook]
verify_jwt = false

# Alarmas: los paneles y centrales no envian JWT; la autenticidad la da el token
# secreto de cada alarma (solo se guarda su hash).
[functions.alarm-webhook]
verify_jwt = false

# Contabilidad por API (Siigo, Alegra): solo la administracion (se verifica dentro).
[functions.accounting-sync]
verify_jwt = true
